# SPDX-License-Identifier: GPL-3.0-only
# Publishes site/ to the gh-pages branch, which GitHub Pages serves.
# Plain git, no third-party actions: the branch is rebuilt from site/ on every run, so it only ever
# holds the site, never the source history.
name: Deploy site to gh-pages

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the default branch deploys, whatever it's called; pushes elsewhere don't touch the live site.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site's local links resolve
        run: |
          set -eu
          cd site
          missing=0
          for page in *.html; do
            # every src/href that isn't a URL, a fragment or a mailto must be a file in site/
            for ref in $(grep -oE '(src|href)="[^"#?]+' "$page" | sed -E 's/^(src|href)="//' \
                         | grep -vE '^(https?:|mailto:|\./?$)' | sort -u); do
              if [ ! -e "$ref" ]; then echo "$page: missing $ref"; missing=1; fi
            done
          done
          exit "$missing"

      - name: Push site/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site from ${SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
